<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File For File</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <div class="navBar">
        <div class="navTitle">File For File</div>
        <div class="navLinks">
            <a href="#" id="navConversions">Conversions</a>
            <a href="#" id="navConvert">Convert</a>
            <a href="#" id="navOther">Other</a>
        </div>
    </div>
    
    <div id="mainView" class="mainContainer">
        <div class="controlsContainer">
            <input type="text" id="searchInput" class="searchBar" placeholder="Search formats...">
            <button id="toggleDetailsBtn" class="toggleButton">Show Details</button>
        </div>
        <div id="formatGrid" class="formatGrid"></div>
    </div>

    <div id="infoView" class="mainContainer hidden">
        <button id="backBtn" class="toggleButton backButton">← Back to all</button>
        
        <div class="infoLayout">
            <div class="sidePanel">
                <div class="panelHeader">convert from:</div>
                <div id="convertFromList" class="bubbleList"></div>
            </div>
            
            <div class="centerPanel">
                <div id="infoTitle" class="infoTitle"></div>
                <div id="infoDesc" class="infoDesc"></div>
            </div>
            
            <div class="sidePanel">
                <div class="panelHeader">convert to:</div>
                <div id="convertToList" class="bubbleList"></div>
            </div>
        </div>
    </div>

    <div id="convertView" class="mainContainer hidden">
        <div id="dropZone" class="dropZone">
            drag and drop (will load to memory), or <span id="selectFilesText">select file(s)</span>
        </div>
        
        <div class="convertLayout">
            <div class="convertCol">
                <div class="panelHeader">File(s) selected:</div>
                <div id="selectedFilesList" class="fileList"></div>
            </div>
            
            <div class="convertCol centerCol">
                <div class="panelHeader">convert to:</div>
                <input type="text" id="convertSearchInput" class="searchBar convertSearch" placeholder="Search...">
                <div id="convertTargetList" class="bubbleList rowBubbles"></div>
            </div>
            
            <div class="convertCol">
                <div class="panelHeader">Options</div>
                <div class="optionsContainer">
                    <button id="executeConvertBtn" class="toggleButton executeBtn">convert</button>
                </div>
            </div>
        </div>
    </div>

    <div id="otherView" class="mainContainer hidden">
        <div class="settingsHeader">settings</div>
        <div class="settingsLayout">
            <div class="settingRow">
                <span class="settingLabel">Dark / light theme</span>
                <select id="themeSelect" class="settingSelect">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>
            <div class="settingRow">
                <span class="settingLabel">Default save location</span>
                <select id="saveLocationSelect" class="settingSelect">
                    <option value="downloads">Downloads</option>
                    <option value="scriptFolder">Folder where script resides</option>
                    <option value="customFolder">Folder of choice...</option>
                </select>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
